docs:
  content: |-
    ## 01 – Basic Requests

    Demonstrates a simple CRUD flow against [JSONPlaceholder](https://jsonplaceholder.typicode.com),
    the free fake REST API. No auth required.

    ```bash
    # Run just this folder with an environment
    bru run "01-Basic-Requests" --env Production

    # Run with inline variable override
    bru run "01-Basic-Requests" --env Production --env-var baseUrl=https://jsonplaceholder.typicode.com
    ```
  type: text/markdown
