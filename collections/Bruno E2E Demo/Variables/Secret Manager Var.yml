info:
  name: Secret Manager Var
  type: http
  seq: 3

http:
  method: post
  url: https://www.httpfaker.org/api/auth/oauth2/client-credentials/token
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "grant_type": "client_credentials",
        "client_id": "demo-client-id",
        "client_secret": "demo-client-secret",
        "scope": "user:read",
        "azure_secret": "{{$secrets.azure-keys.reqres-api-key}}"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
