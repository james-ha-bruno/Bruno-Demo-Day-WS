info:
  name: Bruno Variable Precedence
  type: http
  seq: 1

http:
  method: POST
  url: https://www.httpfaker.org/api/echo?token={{tokenVar}}
  headers:
    - name: Accept
      value: application/json
  params:
    - name: token
      value: "{{tokenVar}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: tokenVar
      value: tokenRequest
  scripts:
    - type: before-request
      code: |-
        const tokenValue = 'tokenRuntime';
        bru.setVar('tokenVar',tokenValue);
        //bru.deleteVar('tokenVar')

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
