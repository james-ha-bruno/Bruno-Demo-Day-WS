name: Bruno CLI Showcase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bruno environment to run against
        required: true
        default: Production
        type: choice
        options:
          - Production
          - Local

      folder:
        description: 'Folder to run (leave blank to run the entire collection)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 01-Basic-Requests
          - 02-Chained-Requests
          - 03-Scripting
          - 04-Tests-and-Assertions
          - 05-Data-Driven
          - 06-Tags-and-Filtering

      tags:
        description: 'Only run requests with these tags (comma-separated, e.g. smoke,regression)'
        required: false
        default: ''

      exclude_tags:
        description: 'Skip requests with these tags (comma-separated, e.g. slow)'
        required: false
        default: ''

      tests_only:
        description: Only run requests that have tests
        required: false
        default: false
        type: boolean

      bail:
        description: Stop execution on the first failure
        required: false
        default: false
        type: boolean

      data_driven:
        description: Use CSV file for data-driven run (05-Data-Driven folder only)
        required: false
        default: false
        type: boolean

jobs:
  run-collection:
    name: "bru run - ${{ inputs.environment }}${{ inputs.folder != '' && format(' / {0}', inputs.folder) || '' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno collection
        working-directory: ./collections/Bruno CLI Showcase
        shell: bash
        env:
          # -- Map workflow inputs to readable variable names ----------------
          BRU_FOLDER:       ${{ inputs.folder }}
          BRU_ENV:          ${{ inputs.environment }}
          BRU_TAGS:         ${{ inputs.tags }}
          BRU_EXCLUDE_TAGS: ${{ inputs.exclude_tags }}
          BRU_TESTS_ONLY:   ${{ inputs.tests_only }}
          BRU_BAIL:         ${{ inputs.bail }}
          BRU_DATA_DRIVEN:  ${{ inputs.data_driven }}
        run: |
          args=()

          # Target folder  (omit to run the whole collection)
          [[ -n "$BRU_FOLDER"       ]] && args+=("$BRU_FOLDER")

          # Environment
          args+=(--env "$BRU_ENV")

          # Tag filters
          [[ -n "$BRU_TAGS"         ]] && args+=(--tags         "$BRU_TAGS")
          [[ -n "$BRU_EXCLUDE_TAGS" ]] && args+=(--exclude-tags "$BRU_EXCLUDE_TAGS")

          # Flags
          [[ "$BRU_TESTS_ONLY" == true ]] && args+=(--tests-only)
          [[ "$BRU_BAIL"       == true ]] && args+=(--bail)

          # Data-driven CSV
          [[ "$BRU_DATA_DRIVEN" == true ]] && args+=(--csv-file-path "05-Data-Driven/users.csv")

          # Reporters
          args+=(--reporter-json  results.json)
          args+=(--reporter-junit results.xml)
          args+=(--reporter-html  results.html)

          # Print the resolved command to the Job Summary before running
          echo "### bru run command" >> "$GITHUB_STEP_SUMMARY"
          printf 'bru run %s\n' "${args[*]}" >> "$GITHUB_STEP_SUMMARY"

          bru run "${args[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-cli-showcase-reports
          path: |
            ./collections/Bruno CLI Showcase/results.json
            ./collections/Bruno CLI Showcase/results.xml
            ./collections/Bruno CLI Showcase/results.html
