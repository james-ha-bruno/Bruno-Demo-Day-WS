name: Bruno CLI Showcase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Bruno environment to run against
        required: true
        default: Production
        type: choice
        options:
          - Production
          - Local

      folder:
        description: 'Folder to run (leave blank to run the entire collection)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 01-Basic-Requests
          - 02-Chained-Requests
          - 03-Scripting
          - 04-Tests-and-Assertions
          - 05-Data-Driven
          - 06-Tags-and-Filtering

      tags:
        description: 'Only run requests with these tags (comma-separated, e.g. smoke,regression)'
        required: false
        default: ''

      exclude_tags:
        description: 'Skip requests with these tags (comma-separated, e.g. slow)'
        required: false
        default: ''

      tests_only:
        description: Only run requests that have tests
        required: false
        default: false
        type: boolean

      bail:
        description: Stop execution on the first failure
        required: false
        default: false
        type: boolean

      data_driven:
        description: Use CSV file for data-driven run (05-Data-Driven folder only)
        required: false
        default: false
        type: boolean

jobs:
  run-collection:
    name: bru run – ${{ inputs.environment }}${{ inputs.folder != '' && format(' / {0}', inputs.folder) || '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Build bru run command
        id: build-cmd
        shell: bash
        run: |
          CMD="bru run"

          # Folder (optional)
          if [ -n "${{ inputs.folder }}" ]; then
            CMD="$CMD \"${{ inputs.folder }}\""
          fi

          # Environment
          CMD="$CMD --env ${{ inputs.environment }}"

          # Tag filters
          if [ -n "${{ inputs.tags }}" ]; then
            CMD="$CMD --tags ${{ inputs.tags }}"
          fi
          if [ -n "${{ inputs.exclude_tags }}" ]; then
            CMD="$CMD --exclude-tags ${{ inputs.exclude_tags }}"
          fi

          # Flags
          if [ "${{ inputs.tests_only }}" = "true" ]; then
            CMD="$CMD --tests-only"
          fi
          if [ "${{ inputs.bail }}" = "true" ]; then
            CMD="$CMD --bail"
          fi

          # Data-driven CSV (only meaningful for 05-Data-Driven)
          if [ "${{ inputs.data_driven }}" = "true" ]; then
            CMD="$CMD --csv-file-path \"05-Data-Driven/users.csv\""
          fi

          # Reporters
          CMD="$CMD --reporter-json results.json --reporter-junit results.xml --reporter-html results.html"

          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "### bru run command" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "$CMD" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run Bruno collection
        working-directory: ./collections/Bruno CLI Showcase
        run: ${{ steps.build-cmd.outputs.cmd }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-cli-showcase-reports
          path: |
            ./collections/Bruno CLI Showcase/results.json
            ./collections/Bruno CLI Showcase/results.xml
            ./collections/Bruno CLI Showcase/results.html
